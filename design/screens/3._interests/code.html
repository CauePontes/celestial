"xl":"0.75rem","full":"9999px"},"spacing":{"space-lg":"1.5rem","space-xl":"2rem","margin":"1.25rem","space-sm":"0.5rem","gutter":"1rem","space-xs":"0.25rem","space-md":"1rem"},"fontFamily":{"body-md":["Plus Jakarta Sans"],"display-lg-mobile":["Playfair Display"],"headline-md":["Playfair Display"],"label-sm":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"label-lg":["Plus Jakarta Sans"],"headline-lg":["Playfair Display"],"headline-sm":["Playfair Display"],"display-lg":["Playfair Display"],"label-md":["Plus Jakarta Sans"]},"fontSize":{"body-md":["15px",{"lineHeight":"23px","fontWeight":"400"}],"display-lg-mobile":["30px",{"lineHeight":"38px","letterSpacing":"-0.02em","fontWeight":"500"}],"headline-md":["22px",{"lineHeight":"30px","letterSpacing":"-0.01em","fontWeight":"500"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.06em","fontWeight":"500"}],"body-sm":["13px",{"lineHeight":"19px","fontWeight":"400"}],"body-lg":["17px",{"lineHeight":"26px","fontWeight":"400"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.02em","fontWeight":"600"}],"headline-lg":["28px",{"lineHeight":"36px","letterSpacing":"-0.01em","fontWeight":"500"}],"headline-sm":["18px",{"lineHeight":"26px","fontWeight":"500"}],"display-lg":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"500"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.04em","fontWeight":"600"}]}}}};</script></head><body class="bg-surface text-on-surface font-body-md text-body-md pt-safe pb-safe flex flex-col"><main class="flex flex-col relative w-full px-margin bg-surface"><div class="flex flex-col w-full gap-space-lg pb-space-xl">
<!-- Minimal Top Bar -->
<div class="flex items-center justify-between w-full py-space-sm">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex items-center gap-space-sm">
<div class="flex items-center gap-1.5">
<span class="w-4 h-1 rounded-full bg-primary/30"></span>
<span class="w-6 h-1 rounded-full bg-primary"></span>
</div>
<span class="font-label-sm text-label-sm uppercase text-on-surface-variant">Step 2 of 2</span>
</div>
</div>
<!-- Editorial Header -->
<div class="relative flex flex-col gap-space-sm pt-space-xs">
<div class="absolute -top-6 -right-4 w-32 h-32 pointer-events-none opacity-25 text-primary">
<svg class="w-full h-full" fill="none" viewbox="0 0 120 120">
<circle cx="60" cy="60" r="48" stroke="currentColor" stroke-dasharray="3 4" stroke-width="0.75"></circle>
<circle cx="60" cy="60" r="32" stroke="currentColor" stroke-width="0.5"></circle>
<circle cx="94" cy="26" fill="currentColor" r="2.5"></circle>
</svg>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">
      What draws you inward?
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
      Select the areas you'd like to explore. You can adjust these anytime.
    </p>
</div>
<!-- Interactive Interest Selection Cards -->
<div class="flex flex-col gap-gutter" id="interests-grid">
<!-- Card 1: Astrology (Pre-selected) -->
<button aria-pressed="true" class="interest-card group relative flex items-center justify-between w-full p-5 rounded-xl bg-surface-container-high text-on-surface shadow-[0_8px_28px_rgba(207,189,255,0.12)] transition-all duration-300 text-left" data-interest="astrology" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="icon-wrap flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-primary-fixed transition-colors duration-300 shrink-0">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">nights_stay</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface truncate">Astrology</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Natal charts, transits &amp; daily skies</span>
</div>
</div>
<div class="check-indicator flex items-center justify-center w-6 h-6 rounded-full bg-primary text-on-primary transition-all duration-300 shrink-0 ml-space-sm">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Card 2: Relationships -->
<button aria-pressed="false" class="interest-card group relative flex items-center justify-between w-full p-5 rounded-xl bg-surface-container text-on-surface transition-all duration-300 text-left hover:bg-surface-container-high" data-interest="relationships" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="icon-wrap flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-highest text-tertiary transition-colors duration-300 shrink-0">
<span class="material-symbols-outlined text-[24px]">favorite</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface truncate">Relationships</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Synastry, compatibility &amp; bonds</span>
</div>
</div>
<div class="check-indicator flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest text-transparent transition-all duration-300 shrink-0 ml-space-sm">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Card 3: Numerology -->
<button aria-pressed="false" class="interest-card group relative flex items-center justify-between w-full p-5 rounded-xl bg-surface-container text-on-surface transition-all duration-300 text-left hover:bg-surface-container-high" data-interest="numerology" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="icon-wrap flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-highest text-tertiary transition-colors duration-300 shrink-0">
<span class="material-symbols-outlined text-[24px]">auto_awesome</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface truncate">Numerology</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Life path numbers &amp; personal cycles</span>
</div>
</div>
<div class="check-indicator flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest text-transparent transition-all duration-300 shrink-0 ml-space-sm">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Card 4: Meditation (Pre-selected) -->
<button aria-pressed="true" class="interest-card group relative flex items-center justify-between w-full p-5 rounded-xl bg-surface-container-high text-on-surface shadow-[0_8px_28px_rgba(207,189,255,0.12)] transition-all duration-300 text-left" data-interest="meditation" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="icon-wrap flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-primary-fixed transition-colors duration-300 shrink-0">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">self_improvement</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface truncate">Meditation</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Guided stillness &amp; lunar breathwork</span>
</div>
</div>
<div class="check-indicator flex items-center justify-center w-6 h-6 rounded-full bg-primary text-on-primary transition-all duration-300 shrink-0 ml-space-sm">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Card 5: Journaling -->
<button aria-pressed="false" class="interest-card group relative flex items-center justify-between w-full p-5 rounded-xl bg-surface-container text-on-surface transition-all duration-300 text-left hover:bg-surface-container-high" data-interest="journaling" type="button">
<div class="flex items-center gap-space-md min-w-0">
<div class="icon-wrap flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-highest text-tertiary transition-colors duration-300 shrink-0">
<span class="material-symbols-outlined text-[24px]">edit_note</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface truncate">Journaling</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Reflective prompts &amp; dream logs</span>
</div>
</div>
<div class="check-indicator flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest text-transparent transition-all duration-300 shrink-0 ml-space-sm">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
</div>
<!-- Primary CTA Section -->
<div class="flex flex-col items-center gap-space-sm pt-space-md">
<button class="w-full py-4 px-6 rounded-full bg-primary-container text-primary-fixed font-label-lg text-label-lg shadow-[0_8px_24px_rgba(85,50,168,0.45)] hover:bg-secondary-container active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-space-sm" id="enter-cta" type="button">
<span>Enter Celestial</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<span class="font-label-sm text-label-sm text-on-surface-variant" id="selection-count">2 areas selected</span>
</div>
</div>
<script>
  (function () {
    const cards = document.querySelectorAll('.interest-card');
    const countLabel = document.getElementById('selection-count');
    const enterCta = document.getElementById('enter-cta');

    function updateCount() {
      const activeCount = document.querySelectorAll('.interest-card[aria-pressed="true"]').length;
      if (activeCount === 0) {
        countLabel.textContent = 'Select at least one area';
      } else if (activeCount === 1) {
        countLabel.textContent = '1 area selected';
      } else {
        countLabel.textContent = activeCount + ' areas selected';
      }
    }

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        const isSelected = card.getAttribute('aria-pressed') === 'true';
        const nextState = !isSelected;
        card.setAttribute('aria-pressed', String(nextState));

        const iconWrap = card.querySelector('.icon-wrap');
        const icon = iconWrap.querySelector('.material-symbols-outlined');
        const check = card.querySelector('.check-indicator');

        if (nextState) {
          card.classList.remove('bg-surface-container');
          card.classList.add('bg-surface-container-high', 'shadow-[0_8px_28px_rgba(207,189,255,0.12)]');

          iconWrap.classList.remove('bg-surface-container-highest', 'text-tertiary');
          iconWrap.classList.add('bg-primary-container', 'text-primary-fixed');
          icon.style.fontVariationSettings = "'FILL' 1";

          check.classList.remove('bg-surface-container-highest', 'text-transparent');
          check.classList.add('bg-primary', 'text-on-primary');
        } else {
          card.classList.remove('bg-surface-container-high', 'shadow-[0_8px_28px_rgba(207,189,255,0.12)]');
          card.classList.add('bg-surface-container');

          iconWrap.classList.remove('bg-primary-container', 'text-primary-fixed');
          iconWrap.classList.add('bg-surface-container-highest', 'text-tertiary');
          icon.style.fontVariationSettings = "'FILL' 0";

          check.classList.remove('bg-primary', 'text-on-primary');
          check.classList.add('bg-surface-container-highest', 'text-transparent');
        }

        updateCount();
      });
    });

    enterCta.addEventListener('click', () => {
      enterCta.classList.add('opacity-90');
      setTimeout(() => {
        enterCta.classList.remove('opacity-90');
      }, 200);
    });
  })();
</script></main></body></html>
